name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t quotes:${{ github.sha }} .
      - name: Start
        run: docker run -d --name quotes -p 3000:3000 quotes:${{ github.sha }}
      - name: Smoke test
        run: |
          curl --retry 10 --retry-all-errors --retry-delay 1 -fsS http://localhost:3000/health
          curl -fsS http://localhost:3000/version | grep "${{ github.sha }}"
      - name: Container logs
        if: always()
        run: docker logs quotes
